<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lockdown: Campus Escape</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#050506}
html,body{height:100%;margin:0;background:var(--bg);font-family:Georgia,"Times New Roman",serif}
body{display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
canvas{width:100%;aspect-ratio:960/420;background:#000;display:block;touch-action:none}
canvas{width:min(100vw,calc(100dvh*960/420));height:auto}
#touch{display:none;position:fixed;inset:0;pointer-events:none;z-index:5}
body.touch.playing #touch{display:block}
#touch *{-webkit-tap-highlight-color:transparent;touch-action:none}
#jz{position:absolute;left:0;bottom:0;width:35%;height:62%;pointer-events:auto}
#jb{position:absolute;left:calc(env(safe-area-inset-left,0px) + 36px);bottom:30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.28)}
#jk{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.3);border:2px solid rgba(255,255,255,.5)}
.tb{position:absolute;pointer-events:auto;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#eee;font:bold 12px Georgia,serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;bottom:30px;width:62px;height:62px}
#bE{right:calc(env(safe-area-inset-right,0px) + 28px);width:90px;height:90px;font-size:28px}
#bE small{font-size:9px;font-weight:normal;letter-spacing:.5px}
#bR{right:calc(env(safe-area-inset-right,0px) + 128px)}
#bS{right:calc(env(safe-area-inset-right,0px) + 200px)}
#bE.ready{background:rgba(192,18,26,.55);border-color:#e8d98a}
#bE:active{background:rgba(192,18,26,.85)}
.tb.on{background:rgba(232,217,138,.35);border-color:#e8d98a}
#rot{display:none;position:fixed;inset:0;z-index:9;background:#050506;color:#cfcfcf;align-items:center;justify-content:center;text-align:center;font-size:20px;padding:30px}
@media (orientation:portrait){body.touch #rot{display:flex}}
</style></head><body>
<canvas id="c" width="960" height="420"></canvas>
<div id="touch"><div id="jz"><div id="jb"><div id="jk"></div></div></div><button class="tb" id="bS">SNEAK</button><button class="tb" id="bR">RUN</button><button class="tb" id="bE">E<small>INTERACT</small></button></div>
<div id="rot">Please rotate your device to landscape to play</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=960,H=420,WW=1700,WH=760;
const lc=document.createElement('canvas');lc.width=W;lc.height=H;const lx=lc.getContext('2d');
const keys={};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(!e.repeat)onKey(k);if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(state==='play')state='pause'});
cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;for(const b of btns)if(x>=b.x-2&&x<=b.x+b.w+2&&y>=b.y-2&&y<=b.y+b.h+2){b.fn();break}});
let ac;
function snd(f,d,t='sine',v=.1,sl=0){try{ac=ac||new AudioContext();if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.type=t;o.frequency.value=f;if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+sl),n+d);g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(n+d)}catch(e){}}

// ---- touch controls ----
let isTouch=matchMedia('(pointer:coarse)').matches;
const touch={run:false,sneak:false},joy={x:0,y:0};
if(isTouch)document.body.classList.add('touch');
addEventListener('touchstart',()=>{if(!isTouch){isTouch=true;document.body.classList.add('touch')}},{passive:true});
addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')state='pause'});
const $=id=>document.getElementById(id),jz=$('jz'),jb=$('jb'),jk=$('jk'),bE=$('bE'),bR=$('bR'),bS=$('bS');
let joyId=null,jox=0,joy0=0,wasPlaying=false;
function joyReset(){joyId=null;joy.x=joy.y=0;jk.style.transform='';jb.style.left=jb.style.top=jb.style.bottom=''}
function joyMove(e){const dx=e.clientX-jox,dy=e.clientY-joy0,l=Math.hypot(dx,dy),k=l>55?55/l:1;jk.style.transform='translate('+dx*k+'px,'+dy*k+'px)';if(l<14){joy.x=joy.y=0}else{joy.x=dx/l;joy.y=dy/l}}
jz.addEventListener('pointerdown',e=>{if(joyId!==null)return;e.preventDefault();joyId=e.pointerId;try{jz.setPointerCapture(e.pointerId)}catch(_){}
  const r=jz.getBoundingClientRect();jox=Math.max(r.left+60,Math.min(r.right-60,e.clientX));joy0=Math.max(r.top+60,Math.min(r.bottom-60,e.clientY));
  jb.style.left=(jox-60-r.left)+'px';jb.style.top=(joy0-60-r.top)+'px';jb.style.bottom='auto';joyMove(e)});
jz.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyMove(e)});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>jz.addEventListener(t,e=>{if(e.pointerId===joyId)joyReset()}));
bE.addEventListener('pointerdown',e=>{e.preventDefault();onKey('e')});
function tog(b,k,o){b.addEventListener('pointerdown',e=>{e.preventDefault();touch[k]=!touch[k];if(touch[k])touch[o]=false;bR.classList.toggle('on',touch.run);bS.classList.toggle('on',touch.sneak)})}
tog(bR,'run','sneak');tog(bS,'sneak','run');
function tryFS(){try{const d=document.documentElement;if(!document.fullscreenElement&&d.requestFullscreen)d.requestFullscreen().then(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(_){}}).catch(()=>{})}catch(_){}}
function syncTouch(){const pl=state==='play';if(pl!==wasPlaying){wasPlaying=pl;document.body.classList.toggle('playing',pl);if(!pl)joyReset()}
  bE.classList.toggle('ready',pl&&!!prompt);if(isTouch&&pl&&innerHeight>innerWidth)state='pause'}
const PE=()=>isTouch?'Tap INTERACT to ':'Press E'+' to ';
const L=(s,k)=>isTouch?s:s+' ('+k+')';

// ---- L-shaped map: horizontal corridor y500-570 (x150-1420), vertical corridor x1350-1420 (y100-570) ----
const walls=[],rooms=[];
const R=(x,y,w,h)=>walls.push({x,y,w,h});
function hs(x1,x2,y,g){if(g==null)R(x1-3,y-3,x2-x1+6,6);else{R(x1-3,y-3,g-30-x1+3,6);R(g+30,y-3,x2-g-30+3,6)}}
function vs(y1,y2,x,g){if(g==null)R(x-3,y1-3,6,y2-y1+6);else{R(x-3,y1-3,6,g-30-y1+3);R(x-3,g+30,6,y2-g-30+3)}}
function room(o){rooms.push(o);const{x,y,w,h,door:d}=o;
  hs(x,x+w,y,d.s==='N'?d.c:null);hs(x,x+w,y+h,d.s==='S'?d.c:null);
  vs(y,y+h,x,d.s==='W'?d.c:null);vs(y,y+h,x+w,d.s==='E'?d.c:null)}
const COL={c:'#1a1610',lib:'#18151c',off:'#1c1414',toi:'#14191a'};
let cid=0;
function cls(x,y,s){const h=x===1420?200:150,r={t:'c',id:++cid,x,y,w:240,h,door:{s,c:s==='W'?y+100:x+120},read:false};
  r.nx=s==='W'?x+220:x+120;r.ny=s==='W'?y+100:s==='N'?y+h-20:y+20;room(r)}
for(let k=0;k<5;k++)cls(150+k*240,570,'N');
for(let k=0;k<3;k++)cls(150+k*240,350,'S');
cls(1420,100,'W');cls(1420,300,'W');
room({t:'lib',x:870,y:350,w:240,h:150,door:{s:'S',c:990}});
room({t:'off',x:1110,y:350,w:240,h:150,door:{s:'E',c:425}});
room({t:'toi',x:20,y:450,w:130,h:170,door:{s:'E',c:535}});
rooms.forEach(r=>r.col=COL[r.t]);
const cl=rooms.filter(r=>r.t==='c');
R(1347,567,76,6);R(1347,97,6,256);R(1417,500,6,73);R(1347,97,76,6);
const hit=(x,y,r)=>walls.some(w=>x+r>w.x&&x-r<w.x+w.w&&y+r>w.y&&y-r<w.y+w.h);
function move(o,dx,dy,r){if(!hit(o.x+dx,o.y,r))o.x+=dx;if(!hit(o.x,o.y+dy,r))o.y+=dy}
// corridor centre line as a path: s=0 west end -> corner (s=1220) -> north end (s=1620)
const S1=1220,ENRAGE=10; // seconds the monster stays enraged after a wrong call
const pathPos=s=>s<=S1?{x:165+s,y:535,dx:1,dy:0}:{x:1385,y:535-(s-S1),dx:0,dy:-1};
function proj(px,py){const a=Math.max(0,Math.min(S1,px-165)),da=Math.hypot(px-165-a,py-535),b=Math.max(0,Math.min(400,535-py)),db=Math.hypot(px-1385,py-535+b);return da<=db?{s:a,d:da}:{s:S1+b,d:db}}
const PHONE={x:1230,y:380},HIDE={x:935,y:430};
const inOffice=p=>p.x>1110&&p.x<1350&&p.y>350&&p.y<500;
const DIFF=[{n:'Easy',h:1,p:1,d:'Easy: the monster hunts at 1x speed. You can outrun it by running.'},{n:'Normal',h:1.5,p:1,d:'Normal: it hunts at 1.5x speed and outpaces your run, so hide.'},{n:'Hard',h:2,p:1,d:'Hard: it hunts at 2x speed.'},{n:'Legend',h:3,p:1.5,d:'Legend: it patrols at 1.5x speed and hunts at 3x speed.'}];
let diff=1,btns=[];

// ---- state ----
let phoneOpen=false,state='intro',player,mon,lights,nums,correct,collected,tried,msg,camX=0,camY=0,sel=null,dialT=0,hb=0,th=0,time=0,face=1,prompt='',shake=0;
function reset(){
  player={x:750,y:645,mode:'still',hidden:false,ang:0};
  const q=pathPos(40);mon={s:40,x:q.x,y:q.y,ang:0,state:'patrol',ts:900,t:0,wait:0,inOff:false,fast:false,ft:0,ot:0,enter:false};
  nums=[];while(nums.length<10){const n='98'+(Math.floor(Math.random()*9e7)+1e7);const s=n.slice(0,5)+' '+n.slice(5);if(!nums.includes(s))nums.push(s)}
  correct=Math.floor(Math.random()*10);collected=[];tried=new Set();
  cl.forEach(r=>r.read=false);
  lights=Array.from({length:13},(_,i)=>({s:60+i*125,i:1,n:0}));
  msg={t:0,text:''};sel=null;dialT=0;phoneOpen=false;
}
reset();
const say=(t,s=3.5)=>msg={t:s,text:t};
function startGame(){reset();state='play';snd(60,.6,'sine',.2);if(isTouch)tryFS()}
function toMenu(){reset();state='intro'}
const near=(p,x,y,r)=>Math.hypot(p.x-x,p.y-y)<r;

function onKey(k){
  if(state==='intro'){if(k==='arrowup'||k==='w')diff=(diff+3)%4;else if(k==='arrowdown'||k==='s')diff=(diff+1)%4;else if(/^[1-4]$/.test(k))diff=+k-1;else if(k==='enter'||k===' ')startGame()}
  else if(state==='pause'){if(k==='p'||k==='escape')state='play';else if(k==='q')toMenu();else if(k==='r'){reset();state='play'}}
  else if(state==='play'&&(k==='p'||(k==='escape'&&!phoneOpen)))state='pause';
  else if((state==='dead'||state==='won')&&k==='q')toMenu();
  else if((state==='dead'||state==='won')&&k==='r'){reset();state='play'}
  else if(state==='play'&&k==='escape'){if(dialT<=0)phoneOpen=false}
  else if(state==='play'&&k==='e')interact();
  else if(state==='play'&&phoneOpen&&/^[1-3]$/.test(k))dial(+k-1);
}
function dial(i){if(dialT>0)return;const ci=collected[i];if(ci===undefined)return;sel=ci;dialT=2.2;ring();shake=1.2;say('The phone rings loudly!',2.2);if(mon.state!=='chase'){mon.state='lure';mon.ts=1330;mon.t=18}}
function interact(){
  const p=player;
  if(p.hidden){p.hidden=false;return}
  for(const r of cl)if(!r.read&&near(p,r.nx,r.ny,42)){
    if(collected.length>=3){say('You can only carry 3 numbers. Dial one to make room.');return}
    r.read=true;collected.push(r.id-1);snd(520,.2,'triangle',.12);
    say('Class '+r.id+' contact sheet: '+nums[r.id-1]+'. Carrying '+collected.length+'/3.');return}
  if(near(p,PHONE.x,PHONE.y,50)){
    if(phoneOpen){if(dialT<=0)phoneOpen=false;return}
    if(!collected.length){say('You have no numbers yet. Search the classrooms.');return}
    phoneOpen=true;sel=null;return}
  if(near(p,HIDE.x,HIDE.y,40)){p.hidden=true;p.x=HIDE.x;p.y=HIDE.y;say('You crouch behind the shelves. The monster can’t find you here.')}
}
function finishDial(){
  if(sel===correct){state='won';snd(330,1.5,'triangle',.15,200)}
  else{tried.add(sel);collected=collected.filter(i=>i!==sel);mon.fast=true;mon.ft=ENRAGE;shake=1;say('Wrong number! The monster is enraged for '+ENRAGE+' seconds.',5);
    if(mon.state!=='chase'){mon.state='lure';mon.ts=1330;mon.t=18}state='play'}
}

// ---- update ----
function ring(){for(let i=0;i<9;i++)setTimeout(()=>snd(i%2?1175:880,.14,'square',.45),i*230)}
function stepTo(m,tx,ty,sp,dt){const dx=tx-m.x,dy=ty-m.y,l=Math.hypot(dx,dy);if(l>1){const k=Math.min(sp*dt,l)/l;m.x+=dx*k;m.y+=dy*k;m.ang=Math.atan2(dy,dx)}}
function updMon(dt){
  if(mon.fast){mon.ft-=dt;if(mon.ft<=0){mon.fast=false;say('The monster calms down.',2.5)}}
  const m=mon,p=player,pr=proj(p.x,p.y),pOff=inOffice(p),D=DIFF[diff],hm=m.fast?Math.max(D.h,2):D.h,pm=m.fast?Math.max(D.p,2):D.p;
  const inRoom=pr.d>=40&&!(m.inOff&&pOff);
  let rad={still:70,sneak:90,walk:210,run:420}[p.mode]*(inRoom?.45:1);if(p.hidden)rad=0;
  const d=Math.hypot(p.x-m.x,p.y-m.y);
  if(m.state!=='chase'&&d<rad){m.state='chase';m.t=6;snd(90,1,'sawtooth',.3,-50)}
  if(m.state==='chase'){if(d<rad*1.4)m.t=6;else m.t-=dt;if(m.t<=0||p.hidden){m.state='patrol';m.ts=40+Math.random()*1540;m.ot=1}}
  if(m.inOff){
    let tx=1230,ty=425,out=false;
    if(m.state==='chase'){if(pOff){tx=p.x;ty=p.y}else out=true}
    else if(m.state==='lure'){tx=PHONE.x;m.t-=dt;if(Math.hypot(m.x-tx,m.y-ty)<25||m.t<=0){m.state='patrol';m.ot=2.5}}
    else{m.ot-=dt;if(m.ot<=0)out=true}
    const sp=m.state==='chase'?145*hm:(m.state==='lure'?110:60)*pm;
    if(out){if(m.x<1338)stepTo(m,1340,425,sp,dt);else{stepTo(m,1390,425,sp,dt);if(m.x>=1385){m.inOff=false;m.s=1330;m.ts=40+Math.random()*1540;const q=pathPos(m.s);m.x=q.x;m.y=q.y}}}
    else if(m.x>1345)stepTo(m,1335,425,sp,dt);
    else stepTo(m,tx,ty,sp,dt);
  }else{
    let ts,sp=60;
    if(m.state==='chase'){ts=pOff?1330:pr.s;sp=145*hm}
    else if(m.state==='lure'){ts=1330;sp=110;m.t-=dt;if(m.t<=0){m.state='patrol';m.ts=300+Math.random()*1200}}
    else{ts=m.ts;if(Math.abs(m.s-ts)<15){m.wait+=dt;if(m.wait>2){m.wait=0;if(Math.random()<.3){m.ts=1330;m.enter=true}else m.ts=40+Math.random()*1540}}}
    if(m.state!=='chase')sp*=pm;const df=ts-m.s;
    if(Math.abs(df)>1){const sg=Math.sign(df);m.s+=sg*Math.min(sp*dt,Math.abs(df));const q=pathPos(m.s);m.x=q.x;m.y=q.y;m.ang=Math.atan2(sg*q.dy,sg*q.dx)}
    if(Math.abs(m.s-1330)<8&&(m.state==='lure'||(m.state==='chase'&&pOff)||m.enter)){m.inOff=true;m.enter=false;m.ot=3}
  }
  if(d<34&&!p.hidden){state='dead';snd(70,1.2,'sawtooth',.4,-40)}
  if(d<520){hb-=dt;if(hb<=0){hb=.35+d/900;snd(60,.15,'sine',.35);setTimeout(()=>snd(50,.15,'sine',.25),150)}
    th-=dt;if(th<=0){th=.7;snd(38,.25,'square',.1)}}
}
function update(dt){
  time+=dt;if(msg.t>0)msg.t-=dt;if(shake>0)shake=Math.max(0,shake-dt*.8);
  if(state==='play'){
    let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
    if(joy.x||joy.y){dx=joy.x;dy=joy.y}
    const mv=(dx||dy)&&!player.hidden;player.mode=!mv?'still':(keys.c||touch.sneak)?'sneak':(keys.shift||touch.run)?'run':'walk';
    if(phoneOpen&&dialT<=0&&(!collected.length||!near(player,PHONE.x,PHONE.y,90)))phoneOpen=false;
    if(mv){const sp={sneak:55,walk:115,run:190}[player.mode],l=Math.hypot(dx,dy);
      move(player,dx/l*sp*dt,dy/l*sp*dt,9);if(dx)face=dx;player.ang=Math.atan2(dy,dx)}
    prompt=player.hidden?PE()+'come out of hiding':'';
    if(!player.hidden){
      if(near(player,HIDE.x,HIDE.y,40))prompt=PE()+'hide behind the shelves';
      if(near(player,PHONE.x,PHONE.y,50))prompt=PE()+'use the Director’s phone';
      for(const r of cl)if(!r.read&&near(player,r.nx,r.ny,42))prompt=collected.length>=3?'Carrying 3/3: dial one to make room':PE()+'read the contact sheet'}
    if(phoneOpen)prompt=''
  }
  if(state==='play'&&dialT>0){dialT-=dt;if(dialT<=0)finishDial()}
  if(state==='play'){
    updMon(dt);
    lights.forEach(l=>{const nr=Math.abs(l.s-mon.s)<420;l.n-=dt;
      if(l.n<=0){if(nr){l.i=Math.random()<.55?Math.random()*.2:1;l.n=.04+Math.random()*.12}
        else{l.i=Math.random()<.02?.3:1;l.n=.2+Math.random()*.6}}});
  }
}

// ---- draw ----
function lite(x,y,r,a){x-=camX;y-=camY;const g=lx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(0,0,0,'+a+')');g.addColorStop(1,'rgba(0,0,0,0)');lx.fillStyle=g;lx.fillRect(x-r,y-r,r*2,r*2)}
function txt(s,x,y,size=14,col='#ddd',al='center'){ctx.font=size+'px Georgia,serif';ctx.fillStyle=col;ctx.textAlign=al;ctx.fillText(s,x,y)}
function btn(l,x,y,w,h,fn,on){ctx.fillStyle=on?'#5a1016':'rgba(30,30,36,.92)';ctx.fillRect(x,y,w,h);ctx.strokeStyle=on?'#c0121a':'#555';ctx.strokeRect(x,y,w,h);txt(l,x+w/2,y+h/2+5,15,'#eee');btns.push({x,y,w,h,fn})}
function lines(arr,x,y,lh,size,col){arr.forEach((s,i)=>txt(s,x,y+i*lh,size,col))}
function fr(c,x,y,w,h){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function drawWorld(){
  fr('#1d1d22',150,500,1270,70);fr('#1d1d22',1350,100,70,470);
  fr('#0b0b0d',1110,100,240,250);txt('STAFF ROOM (LOCKED)',1230,225,11,'#44444c');
  rooms.forEach(r=>{fr(r.col,r.x,r.y,r.w,r.h);const cx=r.x+r.w/2;
    if(r.t==='c'){for(let j=0;j<3;j++){const x=r.x+30+j*70,y=r.y+r.h/2-8;fr('#2b2418',x,y,34,16);ctx.fillStyle='#5d6e5d';ctx.beginPath();ctx.arc(x+17,y+24,6,0,7);ctx.fill()}
      txt('CLASS '+r.id,cx,r.y+r.h/2+50,12,'#6c6c76');fr(r.read?'#555':'#e8d98a',r.nx-7,r.ny-5,14,10)}
    if(r.t==='lib'){for(let i=0;i<5;i++)fr('#3a2a1a',r.x+12+i*46,r.y+8,36,20);fr('#3a2a1a',r.x+12,r.y+45,38,70);txt('LIBRARY (hide here)',cx+30,r.y+135,12,'#7a6a8a')}
    if(r.t==='off'){fr('#3b2f22',1195,360,70,24);fr('#777',1222,362,16,10);txt('DIRECTOR’S OFFICE',cx,r.y+125,12,'#8a7a7a')}
    if(r.t==='toi'){for(let i=0;i<3;i++)fr('#262b2d',r.x+8,r.y+10+i*50,34,40);
